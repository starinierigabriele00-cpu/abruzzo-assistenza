name: Validate Cloudflare Pages static site

on:
  push:
    branches: [main, feat/abruzzo-assistenza-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned test tools (never shipped)
        run: npm install --prefix "$RUNNER_TEMP/abruzzo-ui-check" jsdom@30.1.2 prettier@3.6.2 playwright@1.58.2 @axe-core/playwright@4.11.1 --no-audit --no-fund --ignore-scripts
      - name: Check pages, configuration, layout and JavaScript
        run: |
          python3 scripts/check-site.py
          python3 scripts/sync-layout.py --check
          node --check assets/app.js
          node --test tests/request.test.mjs
          ABRUZZO_TEST_DEPS="$RUNNER_TEMP/abruzzo-ui-check" node --test tests/interactions.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check
      - name: Check formatting
        run: |
          "$RUNNER_TEMP/abruzzo-ui-check/node_modules/.bin/prettier" --check '*.html' 'templates/*.html' assets/styles.css assets/app.js 'tests/*.mjs' '*.md' assets/SOURCES.md config/site.json .prettierrc.json .github/workflows/pages.yml
      - name: Build and verify published artifact
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "base_path=/" >> "$GITHUB_OUTPUT"
          python3 scripts/build-site.py
      - name: Install the pinned Playwright browser
        run: '"$RUNNER_TEMP/abruzzo-ui-check/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Browser QA on the published artifact
        run: |
          site_path="${{ steps.build.outputs.base_path }}"
          python3 scripts/preview-site.py --port 8080 --directory _site --base-path "$site_path" &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          ABRUZZO_BASE_URL="http://127.0.0.1:8080${site_path%/}" ABRUZZO_TEST_DEPS="$RUNNER_TEMP/abruzzo-ui-check" ABRUZZO_QA_OUTPUT="$RUNNER_TEMP/abruzzo-qa" node tests/browser.test.mjs
      - name: Upload QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa
          path: ${{ runner.temp }}/abruzzo-qa
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate
          path: _site
          include-hidden-files: true
