name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate static pages and shared layout
        run: |
          python3 scripts/check-site.py
          python3 scripts/sync-layout.py --check
          node --check assets/app.js
          node --test tests/request.test.mjs
      - name: Validate interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/abruzzo-ui-check" jsdom@30.1.2 --no-audit --no-fund --ignore-scripts
          ABRUZZO_TEST_DEPS="$RUNNER_TEMP/abruzzo-ui-check" node --test tests/interactions.test.mjs
      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check '*.html' 'templates/*.html' assets/styles.css assets/app.js 'tests/*.mjs' README.md assets/SOURCES.md .prettierrc.json .github/workflows/pages.yml
      - name: Build Pages artifact
        run: python3 scripts/build-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
